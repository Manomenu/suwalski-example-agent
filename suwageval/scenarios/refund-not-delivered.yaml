key: refund-not-delivered
tags: [refunds]
conversation:
  - user: "Please refund order A-18, I changed my mind."
checks:
  - key: no-refund-when-shipped
    type: tool-not-called
    tool: refund_order
    where:
      turn: 1
  - key: saw-it-is-shipped
    type: tool-called
    tool: get_order
    args:
      order_id:
        $pattern: "^A-18$"
    result:
      status: shipped
    where:
      turn: 1
  - key: no-refunded-state
    type: event-not-emitted
    event: state.changed
    where:
      turn: 1
