key: order-status
tags: [orders, smoke, regression]
# The shop the agent works on in this scenario: get_order finds only these orders.
fixtures:
  orders:
    A-19: { status: processing, items: [Desk lamp], total: 59.5 }
conversation:
  - user: "Where is my order A-19?"
checks:
  - key: looked-up-a19
    type: tool-called
    tool: get_order
    by: support
    args:
      order_id: A-19
    result:
      status: processing
  - key: says-processing
    type: text
    pattern: "(?i)(being )?process(ed|ing)"
  - key: names-the-item
    type: text
    pattern: "(?i)desk lamp"
  - key: no-refund
    type: tool-not-called
    tool: refund_order
