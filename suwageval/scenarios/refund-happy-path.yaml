# A $judge matcher accepts a free-text argument by meaning; where.after / where.before pin the order of events:
# the refund comes after the lookup and before the state change it causes.
key: refund-happy-path
tags: [regression, refunds]
fixtures:
  orders:
    A-17: { status: delivered, items: [Kettle, Mug x2], total: 89.9 }
conversation:
  - user: "Hi, my kettle from order A-17 arrived broken. I'd like a refund."
checks:
  - key: refund-called-after-lookup
    type: tool-called
    tool: refund_order
    by: support
    args:
      order_id: A-17
      reason:
        $judge:
          description: "Says the item arrived damaged or broken"
          examples: ["kettle arrived broken", "damaged on delivery"]
    result:
      refunded: 89.9
    where:
      turn: 1
      after: get_order
      before: state.changed
  - key: refunded-state-event
    type: event
    event: state.changed
    data:
      node: refunded
      orderId: A-17
    where:
      turn: 1
  - key: confirms-the-refund
    type: text
    pattern: "(?i)refund"
    passThreshold: 0.8
