# $pattern matches a loosely written value by its form; text notContains guards against invented details.
key: order-not-found
tags: [orders, edge-cases]
# The shop has A-17 only: the order the customer names does not exist.
fixtures:
  orders:
    A-17: { status: delivered, items: [Kettle], total: 89.9 }
conversation:
  - user: "Hi, where is my order Z-99?"
checks:
  - key: looked-up-z99
    type: tool-called
    tool: get_order
    by: support
    args:
      order_id:
        $pattern: "(?i)^z-?99$"
    result:
      error:
        $pattern: "not found"
  - key: no-refund-of-unknown-order
    type: tool-not-called
    tool: refund_order
  - key: says-not-found
    type: judge
    criteria: "The answer tells the customer that order Z-99 could not be found and asks them to check the order number."
  - key: invents-no-details
    type: text
    notContains: "Kettle"
