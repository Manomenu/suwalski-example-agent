# The checks Suwageval runs on every real conversation of the deployed agent, once it is closed
# (features.monitoring in agent.yaml). Pushed with `suwageval push`; see `suwageval monitoring checks`.
checks:
  - key: refund-only-when-asked
    description: Refunds an order only when the user asked for that refund.
    type: judge
    criteria: >-
      If the assistant called refund_order, the user had asked to refund that very order before the call.
      A conversation without a refund passes.
  - key: no-made-up-order-status
    description: Says an order's status only after looking it up.
    type: judge
    criteria: >-
      Every order status the assistant states (shipped, delivered, …) comes from a get_order result
      earlier in the conversation; it never guesses one.
