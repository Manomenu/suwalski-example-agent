# The agent under test. Its version (prompt, model, tools, events, retrieval) is not written here: suwageval
# reads it from the running agent at GET {endpointUrl}/suwageval/contract.
# Format: https://github.com/Manomenu/suwalski-agent-eval/blob/master/docs/scenario-format.md
name: suwexag
endpointUrl: http://localhost:7010
# How many times each scenario is sent by default (a scenario or a check can set its own).
samples: 3
# Evaluation (the default) and monitoring: the chat's conversations (POST /chat) go to Suwageval from these environments.
# A fake shop with no personal data, so storing its conversations is fine.
features:
  monitoring:
    closeAfter: 1m
    environments: [local, production]
# `suwageval sweep`: one run per variant file in variants/, against the sweep instance on :7011 (scripts/sweep-variant.sh).
sweep:
  variantsDir: variants
  reconfigure: ./scripts/sweep-variant.sh {variant}
  restore: ./scripts/sweep-variant.sh stop
  waitSeconds: 60
