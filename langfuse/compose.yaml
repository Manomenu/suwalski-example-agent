# Local self-hosted Langfuse (v4, ClickHouse + PostgreSQL + Redis + MinIO), derived from Langfuse's official docker-compose.yml.
# Run it with `just langfuse up` (langfuse/scripts/up.sh): the secrets come from the gitignored ../.env, see ../.env.example.
# Only the web UI/API is published, on 127.0.0.1:3290; the worker and the stores stay on the compose network.
name: suwexag-langfuse

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: http://localhost:3290
  DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:?run just langfuse up}@postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:?}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?}

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4.55.0
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment: *langfuse-env

  langfuse-web:
    image: docker.io/langfuse/langfuse:4.55.0
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - 127.0.0.1:3290:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?}
      # Only the init user below can log in: nobody can sign up (the local single-user setup).
      AUTH_DISABLE_SIGNUP: "true"
      # Headless init: the organization, project, its API keys and the user exist after the first start.
      LANGFUSE_INIT_ORG_ID: suwexag
      LANGFUSE_INIT_ORG_NAME: suwexag
      LANGFUSE_INIT_PROJECT_ID: suwexag
      LANGFUSE_INIT_PROJECT_NAME: suwexag
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL:?}
      LANGFUSE_INIT_USER_NAME: suwexag
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD:?}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12.11
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  # MinIO's own images are no longer published with version tags; Chainguard's only has `latest`, so it is pinned by digest: the multi-arch index built 2026-10-08, at least two weeks old (the repo's rule for image versions).
  minio:
    image: cgr.dev/chainguard/minio@sha256:5ed9207c9d1bf50e2b0aa917ffb0fede5507651178b7bd4119ff75319e7fdeec
    restart: unless-stopped
    entrypoint: sh
    # create the 'langfuse' bucket before starting the service
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  redis:
    image: docker.io/redis:7.4.10-alpine
    restart: unless-stopped
    command: --requirepass ${LANGFUSE_REDIS_PASSWORD:?} --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 10s
      retries: 10
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?}

  postgres:
    image: docker.io/postgres:17.10-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
  redis_data:
